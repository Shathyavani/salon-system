<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services - Glow Salon</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container my-5">
    <h2 class="mb-4 text-center">Our Services</h2>
    <div id="message"></div>
    <div class="row" id="serviceList"></div>
  </div>

  <script src="js/main.js"></script>
  <script>
    renderNavbar();

    async function loadServices() {
      try {
        const res = await fetch(API_URL + '/services');
        const services = await res.json();

        let html = '';
        services.forEach(s => {
          html += `
            <div class="col-md-4 mb-4">
              <div class="card service-card h-100">
                <div class="card-body">
                  <h5 class="card-title">${s.name}</h5>
                  <p class="card-text">${s.description || ''}</p>
                  <p class="mb-1"><strong>Price:</strong> Rs. ${s.price}</p>
                  <p><strong>Time:</strong> ${s.duration_minutes} minutes</p>
                  <a href="booking.html?serviceId=${s.id}" class="btn btn-primary">Book Now</a>
                </div>
              </div>
            </div>`;
        });
        document.getElementById('serviceList').innerHTML = html;
      } catch (err) {
        showMessage('message', 'Cannot load services. Is the server running?', 'danger');
      }
    }

    loadServices();
  </script>
</body>
</html>
