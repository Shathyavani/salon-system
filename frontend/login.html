<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Glow Salon</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="form-box">
    <h3 class="mb-3 text-center">Login</h3>
    <div id="message"></div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" id="email" class="form-control">
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" id="password" class="form-control">
    </div>
    <button class="btn btn-primary w-100" onclick="loginUser()">Login</button>
    <p class="mt-3 text-center">No account? <a href="register.html">Register</a></p>
  </div>

  <script src="js/main.js"></script>
  <script>
    renderNavbar();

    async function loginUser() {
      const data = {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      };

      try {
        const res = await fetch(API_URL + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();

        if (res.ok) {
          localStorage.setItem('token', result.token);
          localStorage.setItem('user', JSON.stringify(result.user));
          window.location.href = 'services.html';
        } else {
          showMessage('message', result.message, 'danger');
        }
      } catch (err) {
        showMessage('message', 'Cannot connect to the server', 'danger');
      }
    }
  </script>
</body>
</html>
