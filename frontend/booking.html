<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Appointment - Glow Salon</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container my-5" style="max-width: 650px;">
    <div class="card service-card p-4">
      <h3 class="mb-3">Book an Appointment</h3>
      <div id="message"></div>

      <div class="mb-3">
        <label class="form-label">Service</label>
        <select id="service" class="form-select" onchange="clearSlots()"></select>
      </div>

      <div class="mb-3">
        <label class="form-label">Staff Member</label>
        <select id="staff" class="form-select" onchange="clearSlots()"></select>
      </div>

      <div class="mb-3">
        <label class="form-label">Date</label>
        <input type="date" id="date" class="form-control" onchange="clearSlots()">
      </div>

      <button class="btn btn-outline-primary" onclick="loadSlots()">Check Available Times</button>

      <div id="slots" class="mt-3"></div>

      <button id="confirmBtn" class="btn btn-primary w-100 mt-3" onclick="confirmBooking()" disabled>
        Confirm Booking
      </button>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    requireLogin();
    renderNavbar();

    let selectedTime = null;

    async function init() {
      try {
        const [serviceRes, staffRes] = await Promise.all([
          fetch(API_URL + '/services'),
          fetch(API_URL + '/staff')
        ]);
        const services = await serviceRes.json();
        const staff = await staffRes.json();

        // if we came from the Services page, pick that service
        const params = new URLSearchParams(window.location.search);
        const chosenId = params.get('serviceId');

        document.getElementById('service').innerHTML = services.map(s =>
          `<option value="${s.id}" ${s.id == chosenId ? 'selected' : ''}>
             ${s.name} - Rs. ${s.price} (${s.duration_minutes} min)
           </option>`
        ).join('');

        document.getElementById('staff').innerHTML = staff.map(s =>
          `<option value="${s.id}">${s.name} (${s.specialty || 'Staff'})</option>`
        ).join('');

        // today's date, and block past dates
        const today = new Date().toLocaleDateString('en-CA'); // format: YYYY-MM-DD
        const dateInput = document.getElementById('date');
        dateInput.min = today;
        dateInput.value = today;
      } catch (err) {
        showMessage('message', 'Cannot load data. Is the server running?', 'danger');
      }
    }

    function clearSlots() {
      selectedTime = null;
      document.getElementById('slots').innerHTML = '';
      document.getElementById('confirmBtn').disabled = true;
    }

    async function loadSlots() {
      clearSlots();
      document.getElementById('message').innerHTML = '';

      const serviceId = document.getElementById('service').value;
      const staffId = document.getElementById('staff').value;
      const date = document.getElementById('date').value;

      if (!date) {
        showMessage('message', 'Please choose a date', 'warning');
        return;
      }

      try {
        const res = await fetch(
          `${API_URL}/appointments/slots?serviceId=${serviceId}&staffId=${staffId}&date=${date}`
        );
        const slots = await res.json();

        if (!res.ok) {
          showMessage('message', slots.message, 'danger');
          return;
        }

        if (slots.length === 0) {
          document.getElementById('slots').innerHTML =
            '<div class="alert alert-warning">No free times on this day. Try another date or staff member.</div>';
          return;
        }

        document.getElementById('slots').innerHTML =
          '<p class="mb-2"><strong>Choose a time:</strong></p>' +
          slots.map(t =>
            `<button class="btn btn-outline-success me-2 mb-2 slot-btn" onclick="selectSlot('${t}', this)">${t}</button>`
          ).join('');
      } catch (err) {
        showMessage('message', 'Cannot connect to the server', 'danger');
      }
    }

    function selectSlot(time, button) {
      selectedTime = time;
      document.querySelectorAll('.slot-btn').forEach(b => {
        b.classList.remove('btn-success');
        b.classList.add('btn-outline-success');
      });
      button.classList.remove('btn-outline-success');
      button.classList.add('btn-success');
      document.getElementById('confirmBtn').disabled = false;
    }

    async function confirmBooking() {
      const data = {
        service_id: document.getElementById('service').value,
        staff_id: document.getElementById('staff').value,
        appointment_date: document.getElementById('date').value,
        start_time: selectedTime
      };

      try {
        const res = await fetch(API_URL + '/appointments', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + getToken()
          },
          body: JSON.stringify(data)
        });
        const result = await res.json();

        if (res.status === 401) {
          alert('Your login has expired. Please log in again.');
          logout();
          return;
        }

        if (res.ok) {
          showMessage('message', 'Booked successfully! Redirecting...', 'success');
          setTimeout(() => window.location.href = 'my-bookings.html', 1500);
        } else {
          showMessage('message', result.message, 'danger');
          loadSlots(); // refresh the times
        }
      } catch (err) {
        showMessage('message', 'Cannot connect to the server', 'danger');
      }
    }

    init();
  </script>
</body>
</html>
